<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Shop</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563eb; --blue-lt: #dbeafe; --blue-mid: #93c5fd;
      --green: #16a34a; --green-lt: #dcfce7;
      --red: #dc2626; --red-lt: #fee2e2;
      --amber: #d97706; --amber-lt: #fef3c7;
      --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
      --gray-400: #9ca3af; --gray-600: #4b5563; --gray-900: #111827;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-50); color: var(--gray-900); min-height: 100dvh;
      display: flex; flex-direction: column; }
    header { background: var(--blue); color: #fff; padding: 0 16px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .app-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    #user-badge { font-size: .8rem; background: rgba(255,255,255,.2); border: none; color: #fff;
      padding: 4px 10px; border-radius: 999px; cursor: pointer; }
    main { flex: 1; padding: 14px 14px 90px; max-width: 560px; width: 100%; margin: 0 auto; }
    .card { background: #fff; border: 1px solid var(--gray-200); border-radius: 12px;
      padding: 14px; margin-bottom: 12px; }
    .card h3 { font-size: .95rem; margin-bottom: 8px; }
    .muted { color: var(--gray-600); font-size: .8rem; }
    .tally { display: flex; gap: 10px; }
    .tally .box { flex: 1; background: var(--blue-lt); border-radius: 10px; padding: 10px; text-align: center; }
    .tally .box b { display: block; font-size: 1.25rem; }
    .tally .box span { font-size: .7rem; color: var(--gray-600); }
    .budgetbar { height: 8px; background: var(--gray-200); border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .budgetbar > div { height: 100%; background: var(--blue); border-radius: 999px; }
    .budgetbar > div.over { background: var(--red); }
    .rules { background: var(--amber-lt); border: 1px solid #fde68a; border-radius: 10px;
      padding: 10px 12px; font-size: .8rem; line-height: 1.55; margin-bottom: 12px; }
    label { display: block; font-size: .75rem; color: var(--gray-600); margin: 8px 0 3px; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid var(--gray-200);
      border-radius: 8px; font-size: .95rem; font-family: inherit; background: #fff; }
    textarea { resize: vertical; min-height: 52px; }
    button.primary { width: 100%; margin-top: 12px; background: var(--blue); color: #fff;
      border: none; border-radius: 10px; padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button.primary:disabled { opacity: .5; }
    .item { border-top: 1px solid var(--gray-100); padding: 10px 0; }
    .item:first-child { border-top: none; }
    .item .t { font-weight: 600; font-size: .92rem; }
    .item .t a { color: var(--blue); text-decoration: none; }
    .item .sub { font-size: .78rem; color: var(--gray-600); margin-top: 2px; }
    .item .fb { font-size: .8rem; background: var(--red-lt); border-radius: 8px; padding: 6px 8px; margin-top: 6px; }
    .badge { display: inline-block; font-size: .68rem; font-weight: 700; border-radius: 999px;
      padding: 2px 8px; margin-left: 6px; vertical-align: middle; }
    .b-proposed { background: var(--amber-lt); color: var(--amber); }
    .b-approved { background: var(--blue-lt); color: var(--blue); }
    .b-ordered  { background: var(--green-lt); color: var(--green); }
    .b-arrived  { background: var(--gray-100); color: var(--gray-600); }
    .b-rejected { background: var(--red-lt); color: var(--red); }
    .row-btns { display: flex; gap: 8px; margin-top: 8px; }
    .row-btns button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--gray-200);
      background: #fff; font-size: .82rem; font-weight: 600; cursor: pointer; }
    .row-btns button.ok { background: var(--green); border-color: var(--green); color: #fff; }
    .row-btns button.no { color: var(--red); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex;
      align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .modal.hidden { display: none; }
    .modal .inner { background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 340px; }
    .modal .inner h2 { font-size: 1rem; margin-bottom: 12px; }
    .whobtn { width: 100%; margin-top: 8px; padding: 12px; border-radius: 10px; font-size: 1rem;
      font-weight: 600; border: 1px solid var(--gray-200); background: var(--gray-50); cursor: pointer; }
    .section-title { font-size: .8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .03em; color: var(--gray-600); margin: 16px 0 6px; }
    .empty { text-align: center; color: var(--gray-400); padding: 24px 0; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <div class="app-title">🛍️ Shop</div>
    <button id="user-badge">…</button>
  </header>
  <main id="main"></main>

  <div class="modal" id="who-modal">
    <div class="inner">
      <h2>Wer bist du?</h2>
      <button class="whobtn" data-who="Alex">Alex</button>
      <button class="whobtn" data-who="Max">Max</button>
      <button class="whobtn" data-who="Mama">Mama</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL  = 'https://mezayharkjyvnnhvdlww.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_bw3Kcni9Yc88BWLp6G93Gg_HIGbqOKF';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    const BOYS = ['Alex', 'Max'];

    let who = localStorage.getItem('shop_user') || null;
    let items = [], budgets = {};

    const el = id => document.getElementById(id);
    const eur = n => (n == null ? '–' : Number(n).toFixed(2).replace('.', ',') + ' €');
    const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    // ── who am I ──
    el('who-modal').addEventListener('click', e => {
      const b = e.target.closest('.whobtn'); if (!b) return;
      who = b.dataset.who; localStorage.setItem('shop_user', who);
      el('who-modal').classList.add('hidden'); render();
    });
    el('user-badge').addEventListener('click', () => el('who-modal').classList.remove('hidden'));

    // ── data ──
    async function load() {
      const [a, b] = await Promise.all([
        db.from('shop_items').select('*').order('created_at', { ascending: false }),
        db.from('shop_budgets').select('*'),
      ]);
      items = a.data || [];
      budgets = Object.fromEntries((b.data || []).map(r => [r.person, r.monthly_eur]));
    }

    function schoolYearStart() {
      const now = new Date();
      return new Date(now.getMonth() + 1 >= 9 ? now.getFullYear() : now.getFullYear() - 1, 8, 1);
    }
    function tally(person) {
      const counted = items.filter(i => i.person === person && ['ordered', 'arrived'].includes(i.status) && i.price != null);
      const anchor = i => new Date(i.ordered_at || i.created_at);
      const now = new Date(), m0 = new Date(now.getFullYear(), now.getMonth(), 1), y0 = schoolYearStart();
      const sum = arr => arr.reduce((s, i) => s + Number(i.price), 0);
      return { month: sum(counted.filter(i => anchor(i) >= m0)), year: sum(counted.filter(i => anchor(i) >= y0)) };
    }

    // ── shared bits ──
    function tallyCard(person) {
      const t = tally(person), b = budgets[person];
      let bar = '';
      if (b) {
        const pct = Math.min(100, Math.round(t.month / b * 100));
        bar = `<div class="budgetbar"><div class="${t.month > b ? 'over' : ''}" style="width:${pct}%"></div></div>
               <div class="muted" style="margin-top:4px">${eur(t.month)} von ${eur(b)} diesen Monat${t.month > b ? ' — drüber!' : ''}</div>`;
      }
      return `<div class="card"><h3>${person === who ? 'Dein Zähler' : person}</h3>
        <div class="tally">
          <div class="box"><b>${eur(t.month)}</b><span>diesen Monat</span></div>
          <div class="box"><b>${eur(t.year)}</b><span>Schuljahr</span></div>
        </div>${bar}</div>`;
    }

    function itemRow(i, actions = '') {
      const badge = { proposed: ['Wartet auf Mama', 'b-proposed'], approved: ['Genehmigt', 'b-approved'],
        ordered: ['Bestellt', 'b-ordered'], arrived: ['Angekommen', 'b-arrived'], rejected: ['Abgelehnt', 'b-rejected'] }[i.status] || ['?', ''];
      const link = i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)} ↗</a>` : esc(i.title);
      return `<div class="item">
        <div class="t">${link}<span class="badge ${badge[1]}">${badge[0]}</span></div>
        <div class="sub">${i.person} · ${eur(i.price)}${i.source === 'extern' ? ' · extern' : ''}${i.note ? ' · „' + esc(i.note) + '"' : ''}</div>
        ${i.feedback ? `<div class="fb">💬 Mama: ${esc(i.feedback)}</div>` : ''}
        ${actions}</div>`;
    }

    // ── boy view ──
    function boyView() {
      const mine = items.filter(i => i.person === who && i.source !== 'extern');
      const open = mine.filter(i => ['proposed', 'approved', 'ordered'].includes(i.status));
      const done = mine.filter(i => ['arrived', 'rejected'].includes(i.status)).slice(0, 10);
      return `
        ${tallyCard(who)}
        <div class="rules"><b>Die Regeln</b> — so wird's genehmigt:<br>
          ✔ 4+ Sterne und ordentlich viele Bewertungen<br>
          ✔ Multipack schlägt Einzelstück — rechne den Preis pro Stück<br>
          ✔ Marke nur mit gutem Grund (dein Zähler merkt sich alles)<br>
          ✔ Schreib dazu, WARUM genau dieses</div>
        <div class="card"><h3>Neuer Vorschlag</h3>
          <label>Was?</label><input id="f-title" placeholder="z.B. Socken 10er-Pack, 43-46">
          <label>Link (Amazon, Girav …)</label><input id="f-url" inputmode="url" placeholder="https://…">
          <label>Preis (€)</label><input id="f-price" inputmode="decimal" placeholder="12,99">
          <label>Warum genau dieses?</label><textarea id="f-note" placeholder="4,5 Sterne, 8.000 Bewertungen, 1,30 €/Paar …"></textarea>
          <button class="primary" onclick="propose()">An Mama schicken</button></div>
        <div class="section-title">Deine Sachen</div>
        <div class="card">${open.map(i => itemRow(i)).join('') || '<div class="empty">Nichts offen.</div>'}</div>
        ${done.length ? `<div class="section-title">Erledigt / Abgelehnt</div><div class="card">${done.map(i => itemRow(i)).join('')}</div>` : ''}`;
    }

    async function propose() {
      const title = el('f-title').value.trim();
      const price = parseFloat(el('f-price').value.replace(',', '.'));
      if (!title) return alert('Was denn?');
      if (!(price > 0)) return alert('Preis fehlt — ohne Preis keine Genehmigung.');
      const url = el('f-url').value.trim();
      const source = /girav/i.test(url) ? 'girav' : (/amazon|amzn/i.test(url) ? 'amazon' : 'other');
      await db.from('shop_items').insert({ person: who, title, url: url || null, price,
        note: el('f-note').value.trim() || null, source, status: 'proposed' });
      await refresh();
    }

    // ── mama view ──
    function mamaView() {
      const queue = items.filter(i => i.status === 'proposed');
      const approved = items.filter(i => i.status === 'approved');
      const ordered = items.filter(i => i.status === 'ordered');
      return `
        ${BOYS.map(tallyCard).join('')}
        <div class="section-title">Zu entscheiden (${queue.length})</div>
        <div class="card">${queue.map(i => itemRow(i, `<div class="row-btns">
            <button class="ok" onclick="decide('${i.id}','approved')">Genehmigen</button>
            <button class="no" onclick="decide('${i.id}','rejected')">Ablehnen</button>
          </div>`)).join('') || '<div class="empty">Nichts zu entscheiden. 🎉</div>'}</div>
        ${approved.length ? `<div class="section-title">Genehmigt — zu bestellen</div>
          <div class="card">${approved.map(i => itemRow(i, `<div class="row-btns">
            <button class="ok" onclick="mark('${i.id}','ordered')">Bestellt ✓</button></div>`)).join('')}</div>` : ''}
        ${ordered.length ? `<div class="section-title">Unterwegs</div>
          <div class="card">${ordered.map(i => itemRow(i, `<div class="row-btns">
            <button onclick="mark('${i.id}','arrived')">Angekommen</button></div>`)).join('')}</div>` : ''}
        <div class="section-title">Extern erfassen (zählt zum Zähler)</div>
        <div class="card">
          <label>Wer?</label><select id="x-person">${BOYS.map(b => `<option>${b}</option>`).join('')}</select>
          <label>Was?</label><input id="x-title" placeholder="z.B. Jeans vom Einkaufssamstag">
          <label>Preis (€)</label><input id="x-price" inputmode="decimal" placeholder="49,90">
          <button class="primary" onclick="addExtern()">Erfassen</button></div>
        <div class="section-title">Budgets (leer = nur Zähler)</div>
        <div class="card">${BOYS.map(b => `
          <label>${b} — € pro Monat</label>
          <input id="bud-${b}" inputmode="decimal" value="${budgets[b] ?? ''}" placeholder="kein Budget">`).join('')}
          <button class="primary" onclick="saveBudgets()">Budgets speichern</button></div>`;
    }

    async function decide(id, status) {
      let feedback = null;
      if (status === 'rejected') {
        feedback = prompt('Kurzes Feedback (warum / was stattdessen)?') || null;
        if (feedback === null) return;
      }
      await db.from('shop_items').update({ status, feedback, decided_at: new Date().toISOString() }).eq('id', id);
      await refresh();
    }
    async function mark(id, status) {
      const patch = { status };
      if (status === 'ordered') patch.ordered_at = new Date().toISOString();
      await db.from('shop_items').update(patch).eq('id', id);
      await refresh();
    }
    async function addExtern() {
      const title = el('x-title').value.trim();
      const price = parseFloat(el('x-price').value.replace(',', '.'));
      if (!title || !(price > 0)) return alert('Was + Preis, bitte.');
      await db.from('shop_items').insert({ person: el('x-person').value, title, price,
        source: 'extern', status: 'ordered', ordered_at: new Date().toISOString() });
      await refresh();
    }
    async function saveBudgets() {
      for (const b of BOYS) {
        const v = parseFloat((el('bud-' + b).value || '').replace(',', '.'));
        await db.from('shop_budgets').upsert({ person: b, monthly_eur: (v > 0 ? v : null) });
      }
      await refresh();
    }

    // ── render ──
    async function refresh() { await load(); render(); }
    function render() {
      if (!who) { el('who-modal').classList.remove('hidden'); return; }
      el('user-badge').textContent = who;
      el('main').innerHTML = (who === 'Mama') ? mamaView() : boyView();
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    refresh();
  </script>
</body>
</html>
